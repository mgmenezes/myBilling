# Postgres local para desenvolvimento e para os testes de integração (AD-010).
# Nada aqui é credencial real: são valores de desenvolvimento local, iguais em
# qualquer máquina. O banco de produção vive no Neon, com a URL em .env.local.

configs:
  criar_banco_de_teste:
    content: |
      CREATE DATABASE mybilling_test OWNER mybilling;

services:
  db:
    # **18, a mesma de produção.** O Neon roda 18, e o AD-010 existe porque
    # divergência de dialeto faz a suíte passar exatamente onde a confiança
    # importa. Testar numa versão e rodar noutra reintroduz o problema em
    # escala menor.
    image: postgres:18-alpine
    container_name: mybilling-db
    environment:
      POSTGRES_USER: mybilling
      POSTGRES_PASSWORD: mybilling
      POSTGRES_DB: mybilling
    ports:
      - "5433:5432"
    configs:
      - source: criar_banco_de_teste
        target: /docker-entrypoint-initdb.d/01-criar-banco-de-teste.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybilling -d mybilling"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # **`/var/lib/postgresql`, e não `/var/lib/postgresql/data`.** A imagem 18
      # mudou a montagem recomendada: o dado passa a viver num subdiretório, o
      # que permite `pg_upgrade --link` sem esbarrar na fronteira do mount.
      # Com o caminho antigo o contêiner sobe e morre.
      - mybilling_pgdata:/var/lib/postgresql

volumes:
  mybilling_pgdata:
