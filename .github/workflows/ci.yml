name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Postgres real, nunca SQLite (AD-010): `CHECK` condicional, índice parcial
    # e tipo `date` divergem de dialeto, e a suíte passaria exatamente onde a
    # confiança importa.
    #
    # Publicado na **5433**, e não na 5432, porque é a porta que
    # `URL_BANCO_DE_TESTE` usa por padrão — a mesma do `docker-compose.yml`.
    # Divergir aqui obrigaria o CI a exportar `DATABASE_URL_TEST`, e o gate
    # deixaria de ser o mesmo comando que roda no terminal.
    services:
      postgres:
        # 18, a mesma de produção no Neon — ver docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: mybilling
          POSTGRES_PASSWORD: mybilling
          POSTGRES_DB: mybilling_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **Antes do `setup-node`, e não depois.** O `cache: pnpm` do `setup-node`
      # roda `pnpm store path` para descobrir o que cachear, e falha com
      # "Unable to locate executable file: pnpm" se o pnpm ainda não estiver no
      # PATH. Era o que derrubava este workflow no terceiro passo, deixando
      # todos os seguintes pulados — o gate do GitHub não era mais fraco que o
      # do terminal, ele não chegava a existir.
      #
      # A versão não é declarada aqui de propósito: a action lê o campo
      # `packageManager` do `package.json`, que é a única fonte da verdade.
      # Declarar nos dois lugares é convite a divergirem.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O projeto do Playwright usa `channel: "chrome"` para não baixar browser
      # no gate local, onde o Chrome já está instalado. No runner ele não está.
      - name: Install Chrome for Playwright
        run: pnpm exec playwright install --with-deps chrome

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Sem passo de migration antes: `recriarBancoDeTeste` derruba o schema e
      # reaplica `drizzle/*.sql` do zero no `beforeAll` de cada arquivo. É essa
      # execução que prova, a cada rodada, que as migrations aplicam num banco
      # limpo — um `db:migrate` separado tiraria a prova do caminho.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Por último porque é o mais lento e o mais frágil: se ele falhar, os
      # gates mais baratos já disseram que o resto está de pé.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Migration do banco gerenciado, **depois** do gate inteiro e **só** em `main`.
  #
  # Por que não no build da Vercel: lá o comando roda também em preview e em
  # cada redeploy, e um branch qualquer passaria a migrar produção. Aqui ela
  # corre uma vez por merge, atrás de 1.150 provas verdes.
  #
  # Por que não à mão: a 5432 de saída é bloqueada na máquina de
  # desenvolvimento, então o caminho manual depende do SQL Editor do Neon e de
  # alguém lembrar. Esquecimento de migration é silencioso até o primeiro erro
  # em produção.
  migrate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Uma de cada vez, e sem cancelar a que já começou: dois merges seguidos
    # dispararão dois `drizzle-kit migrate` contra o mesmo banco, e interromper
    # uma migration pela metade é pior que atrasá-la.
    concurrency:
      group: migrate-producao
      cancel-in-progress: false

    # Existe para dar o gancho de aprovação manual: configure revisores neste
    # environment se quiser que toda migration de produção espere um humano.
    # Sem revisores configurados, ela simplesmente roda.
    environment: producao

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # **Endpoint direto, nunca o `-pooler`.** O PgBouncer do Neon opera em
      # modo transação, e DDL por ele é caminho de falha intermitente. A URL do
      # app (com pooler) e a URL da migration (sem) são variáveis diferentes,
      # de propósito.
      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRETA }}
        run: pnpm db:migrate
